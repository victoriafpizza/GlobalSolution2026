global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/availability.yml

scrape_configs:
  - job_name: rota-livre-api
    metrics_path: /metrics
    scrape_timeout: 5s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.yml
        refresh_interval: 10s
