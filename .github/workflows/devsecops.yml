
name: ROTA LIVRE - DevSecOps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks - Segredos
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar historico Git
        run: |
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --log-opts="--all HEAD" /repo

  semgrep:
    name: Semgrep - Analise de codigo
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analisar seguranca
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d \
            semgrep scan --config p/default --error --metrics=off ROTA-LIVRE/backend ROTA-LIVRE/frontend/src

  build-trivy:
    name: Docker Build e Trivy (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: backend
          - service: frontend
            context: frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar Docker Compose
        run: docker compose -f ROTA-LIVRE/compose.yaml config --quiet

      - name: Construir imagem
        run: |
          docker build --pull -f ROTA-LIVRE/${{ matrix.context }}/dockerfile \
            -t rota-livre-${{ matrix.service }}:ci ROTA-LIVRE/${{ matrix.context }}

      - name: Verificar usuario sem privilegios
        run: |
          uid=$(docker run --rm --entrypoint id rota-livre-${{ matrix.service }}:ci -u)
          echo "UID efetivo: $uid"
          test "$uid" -gt 0

      - name: Trivy - Vulnerabilidades e segredos
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: rota-livre-${{ matrix.service }}:ci
          scanners: vuln,secret
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Testar a instrumentação da API
        if: matrix.service == 'api'
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD/ROTA-LIVRE/backend/test_metrics.py,dst=/app/test_metrics.py,readonly" \
            rota-livre-api:ci python -m unittest -v test_metrics

  deploy:
    name: Deploy - EC2
    needs: [gitleaks, semgrep, build-trivy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: rota-livre-production
    permissions:
      id-token: write
    defaults:
      run:
        shell: bash
    concurrency:
      group: rota-livre-production
      cancel-in-progress: false
    env:
      DEPLOY_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      PUBLIC_URL: ${{ vars.ROTA_LIVRE_PUBLIC_URL }}
      DEPLOY_AUTH: ${{ vars.AWS_DEPLOY_AUTH || 'oidc' }}
      AWS_PAGER: ''

    steps:
      - name: Validar configuração de publicação
        id: config
        run: |
          if [[ ! "$PUBLIC_URL" =~ ^https?://[[:alnum:].-]+(:[0-9]+)?/?$ ]]; then
            echo 'Verifique a GitHub Variable ROTA_LIVRE_PUBLIC_URL.' >&2
            exit 1
          fi
          case "$DEPLOY_AUTH" in
            verified-pull) ;;
            oidc)
              if [[ ! "$DEPLOY_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ||
                    ! "$INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ||
                    ! "$DEPLOY_ROLE" =~ ^arn:aws:iam::([0-9]{12}):role/[[:alnum:]+_.,=@/-]+$ ]]; then
                echo 'Verifique AWS_REGION, AWS_DEPLOY_ROLE_ARN e EC2_INSTANCE_ID.' >&2
                exit 1
              fi
              echo "account=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo 'AWS_DEPLOY_AUTH inválido.' >&2; exit 1 ;;
          esac

      - name: Obter credenciais temporárias via OIDC
        if: env.DEPLOY_AUTH == 'oidc'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.DEPLOY_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          allowed-account-ids: ${{ steps.config.outputs.account }}
          role-session-name: rota-livre-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800

      - name: Executar e acompanhar o deploy via SSM
        if: env.DEPLOY_AUTH == 'oidc'
        id: ssm
        run: |
          command_id=$(aws ssm send-command \
            --document-name RotaLivre-Deploy \
            --instance-ids "$INSTANCE_ID" \
            --parameters "Commit=$GITHUB_SHA" \
            --comment "Rota Livre GitHub Actions run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT" \
            --timeout-seconds 90 --query 'Command.CommandId' --output text)
          [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]]
          printf "Commit \`%s\`\n\nComando SSM \`%s\`\n\n" "$GITHUB_SHA" "$command_id" | tee -a "$GITHUB_STEP_SUMMARY"

          error_file=$(mktemp)
          trap 'rm -f -- "$error_file"' EXIT
          deadline=$((SECONDS + 1300))
          status=Pending
          while (( SECONDS < deadline )); do
            if ! result=$(aws ssm get-command-invocation --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" --plugin-name deploy --output json 2> "$error_file"); then
              if grep -Fq InvocationDoesNotExist "$error_file"; then
                sleep 10
                continue
              fi
              cat "$error_file" >&2
              exit 1
            fi
            status=$(jq -r '.Status' <<< "$result")
            case "$status" in
              Pending|InProgress|Delayed|Cancelling) sleep 10 ;;
              *) break ;;
            esac
          done

          if [[ "$status" =~ ^(Pending|InProgress|Delayed|Cancelling)$ ]]; then
            echo 'A espera pelo comando SSM atingiu o limite.' >&2
            exit 1
          fi
          stop_token=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$stop_token"
          jq -r '.StandardOutputContent, .StandardErrorContent' <<< "$result"
          echo "::$stop_token::"
          printf "Estado do SSM \`%s\`\n\n" "$status" >> "$GITHUB_STEP_SUMMARY"
          [[ "$status" == Success ]]

          output=$(jq -r '.StandardOutputContent' <<< "$result")
          if grep -Fxq "ROTA_LIVRE_DEPLOY_STALE $GITHUB_SHA" <<< "$output"; then
            echo 'Commit superado pelo HEAD de main. Nenhuma publicação executada.' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fxq "ROTA_LIVRE_DEPLOY_OK $GITHUB_SHA" <<< "$output"; then
            echo 'deployed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'SSM concluiu sem confirmar o commit publicado.' >&2
            exit 1
          fi

      - name: Aguardar o commit publicado pela EC2
        if: env.DEPLOY_AUTH == 'verified-pull'
        id: verified-pull
        run: |
          url=${PUBLIC_URL%/}
          repository="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          export GIT_TERMINAL_PROMPT=0
          deadline=$((SECONDS + 1250))
          while (( SECONDS < deadline )); do
            if revision=$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' \
                "$url/deploy-revision.txt?commit=$GITHUB_SHA" 2>/dev/null) && [[ "$revision" == "$GITHUB_SHA" ]]; then
              printf "Commit publicado \`%s\`\n\n" "$revision" | tee -a "$GITHUB_STEP_SUMMARY"
              echo 'deployed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ref=$(timeout 10 git ls-remote --exit-code "$repository" refs/heads/main) && [[ "${ref%%$'\t'*}" != "$GITHUB_SHA" ]]; then
              echo 'Commit superado pelo HEAD de main. Nenhuma publicação esperada.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 12
          done
          echo "A EC2 não confirmou o commit $GITHUB_SHA dentro do limite." >&2
          exit 1

      - name: Validar frontend e API públicos
        if: steps.ssm.outputs.deployed == 'true' || steps.verified-pull.outputs.deployed == 'true'
        run: |
          url=${PUBLIC_URL%/}
          response=$(mktemp)
          trap 'rm -f -- "$response"' EXIT
          frontend_status=$(curl -fsS --retry 3 --max-time 10 -o "$response" -w '%{http_code}' "$url/")
          [[ "$frontend_status" == 200 ]]
          grep -Fq 'id="root"' "$response"
          api_status=$(curl -fsS --retry 3 --max-time 10 -o "$response" -w '%{http_code}' "$url/api/obstacles")
          [[ "$api_status" == 200 ]]
          jq -e '(.obstaculos | type == "array") and (.total == (.obstaculos | length))' "$response" >/dev/null
          printf 'Frontend HTTP %s · API HTTP %s\n' "$frontend_status" "$api_status" | tee -a "$GITHUB_STEP_SUMMARY"
